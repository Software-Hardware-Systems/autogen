syntax = "proto3";

package devteam;

option csharp_namespace = "DevTeam";

// SCRUM Ceremony and Artifact Messages

// --- SCRUM Ceremony Initiation, Participation, and Summary ---

// Initiates a SCRUM ceremony (e.g., Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective)
message ScrumCeremonyInitiated {
  string ceremony_type = 1; // e.g., "SprintPlanning", "DailyScrum", "SprintReview", "SprintRetrospective"
  string initiator = 2;
  string sprint_id = 3;
  string context = 4;
  string timestamp = 5;
}

// Message for agent/human participation in a ceremony
message ScrumCeremonyParticipation {
  string ceremony_type = 1;
  string participant = 2;
  string role = 3; // e.g., "ScrumMaster", "Developer", "ProductOwner", "Stakeholder"
  string message = 4;
  string sprint_id = 5;
  string timestamp = 6;
}

// Message for summarizing the outcome of a ceremony
message ScrumCeremonySummary {
  string ceremony_type = 1;
  string sprint_id = 2;
  string summary = 3;
  repeated string action_items = 4;
  string facilitator = 5;
  string timestamp = 6;
}

// --- SCRUM Artifact Delivery/Consumption ---

// Message for delivering a SCRUM artifact (e.g., Sprint Backlog, Increment, Definition of Done)
message ScrumArtifactDelivered {
  string artifact_type = 1; // e.g., "SprintBacklog", "Increment", "DefinitionOfDone"
  string sprint_id = 2;
  string delivered_by = 3;
  string content = 4;
  string timestamp = 5;
}

// Message for consuming/acknowledging a SCRUM artifact
message ScrumArtifactConsumed {
  string artifact_type = 1;
  string sprint_id = 2;
  string consumed_by = 3;
  string notes = 4;
  string timestamp = 5;
}

// --- SCRUM Human/Agent Interactive Collaboration ---

// Message for requesting input or confirmation during a ceremony
message ScrumCeremonyInputRequest {
  string ceremony_type = 1;
  string requested_from = 2;
  string prompt = 3;
  string sprint_id = 4;
  string timestamp = 5;
}

// Message for providing input or confirmation during a ceremony
message ScrumCeremonyInputResponse {
  string ceremony_type = 1;
  string responder = 2;
  string response = 3;
  string sprint_id = 4;
  string timestamp = 5;
}

// Message for tracking ceremony progress or state
message ScrumCeremonyProgress {
  string ceremony_type = 1;
  string sprint_id = 2;
  string status = 3; // e.g., "NotStarted", "InProgress", "Completed"
  repeated string participants = 4;
  string facilitator = 5;
  string timestamp = 6;
}

// NewAsk Message: Published when the user/client creates a new GitHub issue assigned to the DevTeam
//  - Initiates the DevTeam workflow for processing the user's ask.
// Message Publisher: GitHubWebHookProcessor
//  - In response to the GitHub application webhook for new issue created and assigned to the DevTeam
// Message Handler: Hubber:
//  - Creates a new branch for the DevTeam to work on the issue.
//  - Creates a new Program Manager readme issue, incorporating the original ask.
//      - Posts a comment on the readme issue to initiate the Product Manager workflow.
//  - Creates a new Developer Lead code issue, incorporating the original ask.
//      - Posts a comment on the code issue to initiate the Developer Lead workflow.
//message NewAsk {
  // The user's name
//  string user_name = 1;
  // The user's natural language request or description of the task.
//  string user_message = 2;
//}

// Stakeholder Activity Messages

// Message published when a stakeholder creates a request.
message StakeholderRequest {
  // The user's name
  string user_name = 1;
  // The user's natural language request or description of the task.
  string user_message = 2;
  // The type of request (feature, feedback, question, etc.)
  string request_type = 3;
  // The priority of the request (high, medium, low)
  string priority = 4;
  // Additional context for the request
  string context = 5;
}

// Message published in response to a StakeholderApprove.
message ResponseToStakeholder {
  // The response to the stakeholder request
  string response = 1;
  // The action taken in response to the approval
  string action_taken = 2;
  // Next steps in the process
  repeated string next_steps = 3;
  // Suggestion for the next interaction
  string next_interaction_suggestion = 4;
  // Change requests identified during response
  repeated string change_requests = 5;
  // Whether the item is approved
  bool is_approved = 6;
}

// Message published when a stakeholder approves something.
message StakeholderApprove {
  // The user's name
  string user_name = 1;
  // The user's approval message.
  string user_message = 2;
  // The specific item being approved
  string item_approved = 3;
  // Whether the approval includes change requests
  bool with_changes = 4;
  // Specific changes requested as part of the approval
  repeated string change_requests = 5;
  // The project name this approval relates to
  string project_name = 6;
}

// Message published when a stakeholder asks for clarification.
message StakeholderClarify {
  // The user's name
  string user_name = 1;
  // The user's clarification request message.
  string user_message = 2;
  // Additional context for understanding the request
  string context = 3;
  // Project information
  string project = 4;
  // Additional knowledge relevant to the clarification
  string knowledge = 5;
}

// Message published in response to a StakeholderClarify.
message StakeholderClarified {
  // The response to the stakeholder's ask.
  string response = 1;
  // Specific clarification questions
  repeated string clarification_questions = 2;
  // The AI's understanding of the request
  string understanding = 3;
  // Identified missing aspects in the request
  repeated string missing_aspects = 4;
  // Proactive verification question to anticipate future needs
  string proactive_verification_question = 5;
}

// Message published when a stakeholder provides an answer.
message StakeholderAnswer {
  // The user's name
  string user_name = 1;
  // The user's answer or message.
  string user_message = 2;
  // Reference to the original question
  string question_reference = 3;
  // Context for the answer
  string context = 4;
}

// Message published in response to a StakeholderAnswer.
message StakeholderAnswered {
  // The response to the stakeholder's answer.
  string response = 1;
  // Whether the answer requires follow-up
  bool requires_follow_up = 2;
  // Follow-up question if needed
  string follow_up_question = 3;
  // Status of the answer processing
  string status = 4;
  // Proactive verification question to anticipate future needs
  string proactive_verification_question = 5;
}

// Message published when a stakeholder reviews something.
message StakeholderReview {
  // The user's name
  string user_name = 1;
  // The user's review message.
  string user_message = 2;
  // The specific item being reviewed
  string item_reviewed = 3;
  // Context for the review
  string review_context = 4;
  // Specific areas to focus on in the review
  string specific_focus_areas = 5;
}

// Message published in response to a StakeholderReview.
message StakeholderReviewed {
  // The response to the stakeholder's review.
  string response = 1;
  // Whether the item is approved after review
  bool approved = 2;
  // Changes requested as part of the review
  repeated string changes_requested = 3;
  // Next steps after the review
  string next_steps = 4;
  // Proactive verification question to anticipate future needs
  string proactive_verification_question = 5;
}

// Enhanced stakeholder message types

// Message published when a stakeholder provides a value proposition.
message StakeholderValueProposition {
  // The user's name
  string user_name = 1;
  // The user's message containing value proposition information
  string user_message = 2;
  // The name of the feature
  string feature_name = 3;
  // The customer segment targeted by this feature
  string customer_segment = 4;
  // Feature description
  string description = 5;
  // Expected business benefits
  repeated string expected_benefits = 6;
}

// Message published in response to a StakeholderValueProposition.
message ValuePropositionProcessed {
  // The response to the stakeholder's value proposition
  string response = 1;
  // Formalized value proposition statement
  string formalized_value_proposition = 2;
  // User stories derived from the value proposition
  repeated string related_user_stories = 3;
  // Suggested metrics to track success
  repeated string suggested_metrics = 4;
  // Next steps in the process
  string next_steps = 5;
  // Proactive verification question to anticipate future needs
  string proactive_verification_question = 6;
}

// Message published when a stakeholder provides feature prioritization.
message StakeholderPrioritization {
  // The user's name
  string user_name = 1;
  // The user's message containing prioritization information
  string user_message = 2;
  // Context for the prioritization
  string prioritization_context = 3;
  // Timeline constraints
  string timeline_constraints = 4;
  // Features to prioritize
  repeated PrioritizedFeature features = 5;
  
  // Nested message for feature prioritization details
  message PrioritizedFeature {
    // Feature name
    string feature_name = 1;
    // Relative priority (1 is highest)
    int32 relative_priority = 2;
    // Business value (1-10)
    int32 business_value = 3;
    // Justification for the priority
    string justification = 4;
  }
}

// Message published in response to a StakeholderPrioritization.
message PrioritizationProcessed {
  // The response to the stakeholder's prioritization
  string response = 1;
  // Summary of the updated backlog
  string updated_backlog_summary = 2;
  // Impact on timeline
  repeated string impact_on_timeline = 3;
  // Potential conflicts or issues
  repeated string potential_conflicts = 4;
  // Recommendation for next steps
  string recommendation = 5;
  // Proactive verification question to anticipate future needs
  string proactive_verification_question = 6;
}

// Message published when a stakeholder provides sprint feedback.
message StakeholderSprintFeedback {
  // The user's name
  string user_name = 1;
  // The user's message containing sprint feedback
  string user_message = 2;
  // Sprint identifier
  string sprint_id = 3;
  // Overall assessment of the sprint
  string overall_assessment = 4;
  // Features completed in the sprint
  repeated CompletedFeature completed_features = 5;
  
  // Nested message for completed feature feedback
  message CompletedFeature {
    // Feature name
    string feature_name = 1;
    // Whether the feature meets expectations
    bool meets_expectations = 2;
    // Specific feedback on the feature
    string specific_feedback = 3;
    // Suggested improvements
    repeated string suggested_improvements = 4;
  }
}

// Message published in response to a StakeholderSprintFeedback.
message SprintFeedbackProcessed {
  // The response to the stakeholder's sprint feedback
  string response = 1;
  // Summary of the feedback
  string feedback_summary = 2;
  // Actionable items derived from the feedback
  repeated string actionable_items = 3;
  // Implications for the backlog
  repeated string backlog_implications = 4;
  // Recommendations for the next sprint
  string next_sprint_recommendations = 5;
}

// ReadmeRequested Message: Published whenever a GitHub issue, assigned to the Program Manager, is created or commented on.
//  -Indicates new information is available for the README generation process.
// Message Publisher: GithubWebHookProcessor
//  - In response to the GitHub application webhook for new issue or issue comment
// Message Handler: ProductManager
//  - Uses AI chat completion to generate a README based on the request.
message ReadmeRequested {
  // The user's name
  string user_name = 1;
  // The user's natural language request or description of the task.
  string user_message = 2;
}

// ReadmeGenerated Message:
// This message is published when the Product Manager agent generates a README.
// It is used to provide the generated README to the Hubber agent for further processing.
// Message Publisher: ProductManager
// Message Handler: Hubber
//  - Posts the README as a comment on the GitHub readme issue.
message ReadmeGenerated {
  // The generated README content.
  string readme = 1;
}

// ReadmeIssueClosed Message:
// This message is published when the user approves the generated README and closes the readme issue.
// It signals the end of the README generation workflow.
// Message Publisher: GitHubWebHookProcessor
// Message Handler: ProductManager
//  - Saves the README to azure storage.
message ReadmeIssueClosed {
  // The user's name
  string user_name = 1;
  // The user's natural language request or description of the task.
  string user_message = 2;
  // The generated README content.
  string readme = 3;
}

// ReadmeCreated Message:
// This message is published when the README is finalized and ready for storage.
// It is used to trigger the storage of the README in blob storage.
// Message Publisher: ProductManager
// Message Handler: AzureGenie
//  - Stores the README in blob storage.
message ReadmeCreated {
  // The finalized README content.
  string readme = 1;
}

// ReadmeStored Message:
// This message is published when the README is successfully stored in blob storage.
// It is used to trigger the creation of a pull request for the stored README.
// Message Publisher: AzureGenie
// Message Handler:
// - Hubber: Commits the README to a branch and creates a pull request.
message ReadmeStored {}

// DevPlanRequested Message:
// This message is published when the Developer Lead is assigned a task to generate a development plan.
// It is triggered by the Hubber agent in response to a `NewAsk` event.
// Message Publisher: Hubber
// Message Handler: DeveloperLead:
//  Uses AI capabilities to generate a development plan based on the user's request.
message DevPlanRequested {
  // The user's name
  string user_name = 11;
  // The user's natural language request or description of the task.
  string user_message = 2;
}

// DevPlanGenerated Message:
// This message is published when the Developer Lead agent generates a development plan.
// It is used to provide the generated plan to the Hubber agent for further processing.
// Message Publisher: DeveloperLead
// Message Handler: Hubber:
//  Posts the development plan as a comment on the GitHub issue.
message DevPlanGenerated {
  // The generated development plan content.
  string dev_plan = 1;
}

// DevPlanCreated Message:
// This message is published when the development plan is finalized and ready for task breakdown.
// It is used to trigger the creation of tasks for individual developers.
// Message Publisher: DeveloperLead
// Message Handler:
// - Hubber: Creates GitHub issues for each subtask in the development plan.
message DevPlanCreated {
  // The finalized development plan content.
  string dev_plan = 1;
}

// DevPlanIssueClosed Message:
// This message is published when the user approves the development plan and closes the issue.
// It signals the end of the development plan generation workflow.
// Message Publisher: GitHubWebHookProcessor
// Message Handler:
// - DeveloperLead: Finalizes the development plan and prepares it for task breakdown.
message DevPlanIssueClosed {
  // The user's name
  string user_name = 1;
  // The user's natural language request or description of the task.
  string user_message = 2;
  // The finalized development plan content.
  string dev_plan = 3;
}

// CodeGenerationRequested Message:
// This message is published when a developer is assigned a task to generate code for a specific subtask.
// It is triggered by the Hubber agent in response to a `DevPlanCreated` event.
// Message Publisher: Hubber
// Message Handler:
// - Developer: Uses AI capabilities to generate code for the assigned subtask.
message CodeGenerationRequested {
  // The user's name
  string user_name = 1;
  // The user's natural language request or description of the task.
  string user_message = 2;
}

// CodeGenerated Message:
// This message is published when a developer generates code for a specific subtask.
// It is used to provide the generated code to the Hubber agent for further processing.
// Message Publisher: Developer
// Message Handler:
// - Hubber: Posts the generated code as a comment on the GitHub issue.
message CodeGenerated {
  // The issue number of the GitHub issue.
  int64 issue_number = 1;
  // The generated code content.
  string code = 2;
}

// CodeIssueClosed Message:
// This message is published when the user approves the generated code and closes the issue.
// It signals the end of the code generation workflow.
// Message Publisher: GitHubWebHookProcessor
// Message Handler:
// - Developer: Finalizes the code and prepares it for storage and testing.
message CodeIssueClosed {
  // The user name of the person who approved the code.
  string user_name = 1;
  // The user's message or comment approving the code.
  string user_message = 2;
  // The finalized code content.
  string code = 3;
}

// CodeCreated Message:
// This message is published when the code is finalized and ready for storage and testing.
// It is used to trigger the storage of the code in blob storage and the scheduling of a sandbox run.
// Message Publisher: Developer
// Message Handler: AzureGenie:
//  - Stores the code in blob storage and schedules a sandbox run.
message CodeCreated {
  // The user name of the person who approved the code.
  string user_name = 1;
  // The user's message or comment indicating the completion of the code generation.
  string user_message = 2;
  // The finalized code content.
  string code = 3;
}

// SandboxRunFinished Message:
// This message is published when a sandbox run is completed.
// It is used to trigger the finalization of the code and its integration into the repository.
// Message Publisher: Sandbox
// Message Handler:
// - Hubber: Commits the code to a branch and creates a pull request.
message SandboxRunFinished {
  // The user name of the person who initiated the sandbox run.
  string user_name = 1;
  // The user's message or comment indicating the completion of the sandbox run.
  string user_message = 2;
}

// SandboxRunCreated Message:
// This message is published when a sandbox run is successfully scheduled.
// It is used to trigger the monitoring of the sandbox run.
// Message Publisher: AzureGenie
// Message Handler:
// - Sandbox: Monitors the sandbox run and checks for completion.
message SandboxRunCreated {
  // The user name of the person who initiated the sandbox run.
  string user_name = 1;
  // The user's message or comment initiating the sandbox run.
  string user_message = 2;
}
